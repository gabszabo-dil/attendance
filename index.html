<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="Office attendance tracker PWA">
  <title>Office Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Atlas Design Tokens */
    :root {
      /* Colors */
      --lens-semantic-color-surface-default: #ffffff;
      --lens-semantic-color-surface-variant: #f7f8f9;
      --lens-semantic-color-surface-subtle: #fafbfc;
      --lens-semantic-color-background-base: #ffffff;
      --lens-semantic-color-background-container: #f7f8f9;
      --lens-semantic-color-type-default: #282e37;
      --lens-semantic-color-type-muted: #5c6470;
      --lens-semantic-color-type-disabled: #a0a2a5;
      --lens-semantic-color-action-primary-default: #282e37;
      --lens-semantic-color-action-primary-hover: #3d4551;
      --lens-semantic-color-action-primary-active: #0f1419;
      --lens-semantic-color-action-primary-on-primary: #ffffff;
      --lens-semantic-color-action-secondary-variant: #eeeff0;
      --lens-semantic-color-action-secondary-hover-fill: #f7f8f9;
      --lens-semantic-color-action-secondary-active-fill: #eeeff0;
      --lens-semantic-color-action-secondary-on-secondary: #282e37;
      --lens-semantic-color-action-secondary-outline: #282e37;
      --lens-semantic-color-outline-fixed: #cccdce;
      --lens-semantic-color-status-success-background: #f0faf0;
      --lens-semantic-color-status-success-text: #1f7a1f;
      --lens-semantic-color-status-error-background: #fef0f0;
      --lens-semantic-color-status-error-text: #921a1d;
      --lens-semantic-color-ui-divider-default: #cccdce;
      --lens-core-color-green-50: #1f7a1f;
      --lens-core-color-red-50: #921a1d;
      --lens-core-color-purple-50: #642fcf;
      --lens-core-color-gray-100: #f7f8f9;
      --lens-core-color-gray-200: #eeeff0;
      --lens-core-color-gray-300: #cccdce;
      --lens-core-color-gray-500: #a0a2a5;
      --lens-core-color-gray-700: #5c6470;
      --lens-core-color-blue-40: #0b4cce;

      /* Spacing */
      --lens-semantic-spacing-desktop-padding-1: 4px;
      --lens-semantic-spacing-desktop-padding-2: 8px;
      --lens-semantic-spacing-desktop-padding-3: 12px;
      --lens-semantic-spacing-desktop-padding-4: 16px;
      --lens-semantic-spacing-desktop-padding-5: 20px;
      --lens-semantic-spacing-desktop-padding-6: 24px;
      --lens-semantic-spacing-desktop-gap-2: 8px;
      --lens-semantic-spacing-desktop-gap-3: 12px;
      --lens-semantic-spacing-desktop-gap-4: 16px;

      /* Border radius */
      --lens-core-border-radius-2: 8px;
      --lens-core-border-radius-3: 12px;

      /* Shadows */
      --lens-core-shadow-sm: 0 1px 2px 0 rgba(40, 46, 55, 0.08);
      --lens-core-shadow-md: 0 4px 8px -2px rgba(40, 46, 55, 0.08), 0 2px 4px -2px rgba(40, 46, 55, 0.08);

      /* Typography */
      --lens-core-font-family-default: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--lens-core-font-family-default);
      background-color: var(--lens-semantic-color-background-container);
      color: var(--lens-semantic-color-type-default);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
    }

    .container {
      max-width: 448px;
      margin: 0 auto;
      padding: var(--lens-semantic-spacing-desktop-padding-6) var(--lens-semantic-spacing-desktop-padding-4);
    }

    .card {
      background-color: var(--lens-semantic-color-surface-default);
      border-radius: var(--lens-core-border-radius-2);
      box-shadow: var(--lens-core-shadow-sm);
      padding: var(--lens-semantic-spacing-desktop-padding-6);
      margin-bottom: var(--lens-semantic-spacing-desktop-gap-4);
    }

    .month-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 32px;
      color: var(--lens-semantic-color-type-default);
      margin-bottom: var(--lens-semantic-spacing-desktop-gap-2);
    }

    .compliance-ratio {
      font-size: 32px;
      font-weight: 700;
      line-height: 40px;
    }

    .compliance-success {
      color: var(--lens-core-color-green-50);
    }

    .compliance-error {
      color: var(--lens-core-color-red-50);
    }

    /* Buttons */
    .btn {
      font-family: var(--lens-core-font-family-default);
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      height: 40px;
      padding: 0 var(--lens-semantic-spacing-desktop-padding-4);
      border-radius: var(--lens-core-border-radius-2);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--lens-semantic-spacing-desktop-gap-2);
    }

    .btn-primary {
      background-color: var(--lens-semantic-color-action-primary-default);
      color: var(--lens-semantic-color-action-primary-on-primary);
    }

    .btn-primary:hover {
      background-color: var(--lens-semantic-color-action-primary-hover);
    }

    .btn-primary:active {
      background-color: var(--lens-semantic-color-action-primary-active);
    }

    .btn-secondary {
      background-color: var(--lens-semantic-color-surface-default);
      color: var(--lens-semantic-color-action-secondary-on-secondary);
      border: 1px solid var(--lens-semantic-color-outline-fixed);
      box-shadow: var(--lens-core-shadow-sm);
    }

    .btn-secondary:hover {
      background-color: var(--lens-semantic-color-action-secondary-hover-fill);
    }

    .btn-secondary:active {
      background-color: var(--lens-semantic-color-action-secondary-active-fill);
    }

    /* Navigation */
    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--lens-semantic-spacing-desktop-gap-3);
      margin-bottom: var(--lens-semantic-spacing-desktop-gap-4);
    }

    /* Calendar */
    .weekday-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--lens-semantic-spacing-desktop-gap-2);
      margin-bottom: var(--lens-semantic-spacing-desktop-gap-2);
    }

    .weekday-header {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      color: var(--lens-semantic-color-type-muted);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--lens-semantic-spacing-desktop-gap-2);
    }

    .day-tile {
      aspect-ratio: 1;
      border-radius: var(--lens-core-border-radius-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      border: 2px solid transparent;
    }

    .day-tile:active:not(.weekend) {
      transform: scale(0.95);
    }

    .day-tile.weekend {
      background-color: var(--lens-core-color-gray-100);
      color: var(--lens-semantic-color-type-disabled);
      cursor: default;
    }

    .day-tile.home {
      background-color: var(--lens-core-color-gray-200);
      color: var(--lens-semantic-color-type-default);
    }

    .day-tile.office {
      background-color: var(--lens-semantic-color-status-success-background);
      color: var(--lens-semantic-color-status-success-text);
    }

    .day-tile.holiday {
      background-color: #f5f0ff;
      color: var(--lens-core-color-purple-50);
    }

    .day-tile.today {
      border-color: var(--lens-core-color-blue-40);
      box-shadow: 0 0 0 2px rgba(11, 76, 206, 0.2);
    }

    .day-icon {
      font-size: 12px;
      margin-top: 2px;
    }

    /* Progress bar */
    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--lens-semantic-spacing-desktop-gap-2);
      font-size: 14px;
      font-weight: 600;
      color: var(--lens-semantic-color-type-default);
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background-color: var(--lens-core-color-gray-200);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .progress-success {
      background-color: var(--lens-core-color-green-50);
    }

    .progress-error {
      background-color: var(--lens-core-color-red-50);
    }

    .progress-goal {
      font-size: 12px;
      line-height: 16px;
      color: var(--lens-semantic-color-type-muted);
      text-align: center;
      margin-top: var(--lens-semantic-spacing-desktop-gap-1);
    }

    /* Stats */
    .stats-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 24px;
      color: var(--lens-semantic-color-type-default);
      margin-bottom: var(--lens-semantic-spacing-desktop-gap-3);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--lens-semantic-spacing-desktop-gap-2);
    }

    .stat-label {
      font-size: 14px;
      line-height: 20px;
      color: var(--lens-semantic-color-type-muted);
    }

    .stat-value {
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      color: var(--lens-semantic-color-type-default);
    }

    .stat-row.total {
      border-top: 1px solid var(--lens-semantic-color-ui-divider-default);
      padding-top: var(--lens-semantic-spacing-desktop-gap-2);
      margin-top: var(--lens-semantic-spacing-desktop-gap-2);
    }

    .stat-row.total .stat-label {
      color: var(--lens-semantic-color-type-default);
      font-weight: 600;
    }

    .stat-row.total .stat-value {
      font-weight: 700;
    }

    /* Icons */
    .icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }

    .icon-sm {
      width: 12px;
      height: 12px;
    }

    .icon-lg {
      width: 20px;
      height: 20px;
    }

    /* Status Chips */
    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      line-height: 16px;
      margin-left: 8px;
    }

    .status-chip.success {
      background-color: var(--lens-semantic-color-status-success-background);
      color: var(--lens-semantic-color-status-success-text);
    }

    .status-chip.error {
      background-color: var(--lens-semantic-color-status-error-background);
      color: var(--lens-semantic-color-status-error-text);
    }

    .compliance-ratio {
      font-size: 24px;
      line-height: 32px;
    }
  </style>
</head>
<body>
  <!-- SVG Icon Definitions -->
  <svg style="display: none;">
    <defs>
      <!-- Chevron Left -->
      <symbol id="icon-chevron-left" viewBox="0 0 24 24">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
      </symbol>

      <!-- Chevron Right -->
      <symbol id="icon-chevron-right" viewBox="0 0 24 24">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor"/>
      </symbol>

      <!-- Home -->
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
      </symbol>

      <!-- Building -->
      <symbol id="icon-building" viewBox="0 0 24 24">
        <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z" fill="currentColor"/>
      </symbol>

      <!-- Mood Great (Smile) -->
      <symbol id="icon-mood-great" viewBox="0 0 24 24">
        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>
  <div class="container">
    <!-- Header with compliance ratio -->
    <div class="card">
      <h1 class="month-title" id="monthName">Loading...</h1>
      <div class="compliance-ratio" id="complianceRatio">— / — days — —%</div>
    </div>

    <!-- Navigation -->
    <div class="nav-container">
      <button id="prevMonth" class="btn btn-secondary" aria-label="Previous month">
        <svg class="icon"><use href="#icon-chevron-left"></use></svg>
      </button>
      <button id="todayBtn" class="btn btn-primary">
        Today
      </button>
      <button id="nextMonth" class="btn btn-secondary" aria-label="Next month">
        <svg class="icon"><use href="#icon-chevron-right"></use></svg>
      </button>
    </div>

    <!-- Calendar grid -->
    <div class="card">
      <!-- Weekday headers -->
      <div class="weekday-headers">
        <div class="weekday-header">Mon</div>
        <div class="weekday-header">Tue</div>
        <div class="weekday-header">Wed</div>
        <div class="weekday-header">Thu</div>
        <div class="weekday-header">Fri</div>
        <div class="weekday-header">Sat</div>
        <div class="weekday-header">Sun</div>
      </div>

      <!-- Calendar days -->
      <div id="calendarGrid" class="calendar-grid">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Progress bar -->
    <div class="card">
      <div class="progress-label">
        <span>Office Ratio</span>
        <span id="progressPercent">—%</span>
      </div>
      <div class="progress-track">
        <div id="progressBar" class="progress-fill" style="width: 0%"></div>
      </div>
      <div class="progress-goal">Goal: 50%</div>
    </div>

    <!-- Stats section -->
    <div class="card">
      <h2 class="stats-title">Statistics</h2>
      <div>
        <div class="stat-row">
          <span class="stat-label">
            <svg class="icon icon-sm" style="color: var(--lens-semantic-color-status-success-text);">
              <use href="#icon-building"></use>
            </svg>
            Office days:
          </span>
          <span class="stat-value" id="officeDays">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">
            <svg class="icon icon-sm" style="color: var(--lens-semantic-color-type-muted);">
              <use href="#icon-home"></use>
            </svg>
            Home office days:
          </span>
          <span class="stat-value" id="homeDays">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">
            <svg class="icon icon-sm" style="color: var(--lens-core-color-purple-50);">
              <use href="#icon-mood-great"></use>
            </svg>
            Holidays:
          </span>
          <span class="stat-value" id="holidayDays">0</span>
        </div>
        <div class="stat-row total">
          <span class="stat-label">Total working days:</span>
          <span class="stat-value" id="workingDays">0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================================
    // STATE & DATA
    // ============================================================================

    let currentDate = new Date();
    let viewDate = new Date(); // The month currently being viewed

    const STORAGE_KEY = 'attendance';
    const STATUS = {
      EMPTY: null,      // Home office (default, not stored)
      OFFICE: 'office', // Office day
      HOLIDAY: 'holiday' // Holiday/vacation
    };

    // ============================================================================
    // DATA PERSISTENCE
    // ============================================================================

    function loadAttendance() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : {};
    }

    function saveAttendance(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getDayStatus(dateStr) {
      const attendance = loadAttendance();
      const monthKey = dateStr.substring(0, 7); // "2025-05"
      return attendance[monthKey]?.[dateStr] || STATUS.EMPTY;
    }

    function setDayStatus(dateStr, status) {
      const attendance = loadAttendance();
      const monthKey = dateStr.substring(0, 7);

      if (!attendance[monthKey]) {
        attendance[monthKey] = {};
      }

      if (status === STATUS.EMPTY) {
        // Remove from storage (empty = home office)
        delete attendance[monthKey][dateStr];
        // Clean up empty month objects
        if (Object.keys(attendance[monthKey]).length === 0) {
          delete attendance[monthKey];
        }
      } else {
        attendance[monthKey][dateStr] = status;
      }

      saveAttendance(attendance);
    }

    // ============================================================================
    // DATE UTILITIES
    // ============================================================================

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isWeekend(date) {
      const day = date.getDay();
      return day === 0 || day === 6; // Sunday or Saturday
    }

    function isToday(date) {
      return formatDate(date) === formatDate(currentDate);
    }

    function isFuture(date) {
      return date > currentDate;
    }

    function isSameMonth(date1, date2) {
      return date1.getFullYear() === date2.getFullYear() &&
             date1.getMonth() === date2.getMonth();
    }

    function getMonthName(date) {
      const months = ['January', 'February', 'March', 'April', 'May', 'June',
                      'July', 'August', 'September', 'October', 'November', 'December'];
      return `${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    // ============================================================================
    // CALENDAR CALCULATIONS
    // ============================================================================

    function getMonthStats(date) {
      const year = date.getFullYear();
      const month = date.getMonth();

      // Get first and last day of month
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      let officeCount = 0;
      let holidayCount = 0;
      let weekdayCount = 0;

      // Iterate through all days in the month
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const currentDay = new Date(year, month, day);

        if (!isWeekend(currentDay)) {
          weekdayCount++;

          const dateStr = formatDate(currentDay);
          const status = getDayStatus(dateStr);

          if (status === STATUS.OFFICE) {
            officeCount++;
          } else if (status === STATUS.HOLIDAY) {
            holidayCount++;
          }
        }
      }

      const workingDays = weekdayCount - holidayCount;
      const homeDays = workingDays - officeCount;
      const officePercent = workingDays > 0 ? Math.round((officeCount / workingDays) * 100) : 0;

      return {
        officeCount,
        homeDays,
        holidayCount,
        weekdayCount,
        workingDays,
        officePercent
      };
    }

    // ============================================================================
    // STATUS CYCLING
    // ============================================================================

    function cycleStatus(currentStatus) {
      if (currentStatus === STATUS.EMPTY) {
        return STATUS.OFFICE;
      } else if (currentStatus === STATUS.OFFICE) {
        return STATUS.HOLIDAY;
      } else {
        return STATUS.EMPTY;
      }
    }

    // ============================================================================
    // UI RENDERING
    // ============================================================================

    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      // Update month name
      document.getElementById('monthName').textContent = getMonthName(viewDate);

      // Get first day of month and its weekday (0 = Sunday, 1 = Monday, etc.)
      const firstDay = new Date(year, month, 1);
      let firstWeekday = firstDay.getDay();
      // Convert Sunday (0) to 7 for easier calculation (Monday = 1, Sunday = 7)
      firstWeekday = firstWeekday === 0 ? 7 : firstWeekday;

      // Get last day of month
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      // Add empty cells for days before month starts (Monday = 1, so firstWeekday - 1)
      for (let i = 1; i < firstWeekday; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-tile';
        grid.appendChild(emptyCell);
      }

      // Add day tiles
      for (let day = 1; day <= daysInMonth; day++) {
        const currentDay = new Date(year, month, day);
        const dateStr = formatDate(currentDay);
        const status = getDayStatus(dateStr);
        const weekend = isWeekend(currentDay);
        const today = isToday(currentDay);

        const tile = document.createElement('div');
        tile.className = 'day-tile';

        // Base styles
        if (weekend) {
          tile.className += ' weekend';
        } else {
          // Apply status-based styling
          if (status === STATUS.OFFICE) {
            tile.className += ' office';
          } else if (status === STATUS.HOLIDAY) {
            tile.className += ' holiday';
          } else {
            tile.className += ' home';
          }
        }

        // Today's highlight
        if (today) {
          tile.className += ' today';
        }

        // Day number
        const dayNum = document.createElement('div');
        dayNum.textContent = day;
        tile.appendChild(dayNum);

        // Status icon
        if (!weekend && status !== STATUS.EMPTY) {
          const iconSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          iconSvg.setAttribute('class', 'icon icon-sm');
          const useEl = document.createElementNS('http://www.w3.org/2000/svg', 'use');

          if (status === STATUS.OFFICE) {
            useEl.setAttribute('href', '#icon-building');
          } else if (status === STATUS.HOLIDAY) {
            useEl.setAttribute('href', '#icon-mood-great');
          }

          iconSvg.appendChild(useEl);

          const iconWrapper = document.createElement('div');
          iconWrapper.className = 'day-icon';
          iconWrapper.appendChild(iconSvg);
          tile.appendChild(iconWrapper);
        }

        // Click handler (only for non-weekend days)
        if (!weekend) {
          tile.addEventListener('click', () => {
            const newStatus = cycleStatus(status);
            setDayStatus(dateStr, newStatus);
            renderCalendar();
            updateStats();
          });
        }

        grid.appendChild(tile);
      }
    }

    function updateStats() {
      const stats = getMonthStats(viewDate);

      // Update compliance ratio
      const complianceRatioEl = document.getElementById('complianceRatio');
      const chipClass = stats.officePercent >= 50 ? 'success' : 'error';
      const chipText = stats.officePercent >= 50 ? 'On track' : 'Below target';

      complianceRatioEl.className = `compliance-ratio ${stats.officePercent >= 50 ? 'compliance-success' : 'compliance-error'}`;
      complianceRatioEl.innerHTML = `${stats.officeCount} / ${stats.workingDays} days — ${stats.officePercent}% <span class="status-chip ${chipClass}">${chipText}</span>`;

      // Update stats
      document.getElementById('officeDays').textContent = stats.officeCount;
      document.getElementById('homeDays').textContent = stats.homeDays;
      document.getElementById('holidayDays').textContent = stats.holidayCount;
      document.getElementById('workingDays').textContent = stats.workingDays;

      // Update progress bar
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      progressBar.style.width = `${Math.min(stats.officePercent, 100)}%`;
      progressBar.className = `progress-fill ${stats.officePercent >= 50 ? 'progress-success' : 'progress-error'}`;
      progressPercent.textContent = `${stats.officePercent}%`;
    }

    // ============================================================================
    // NAVIGATION
    // ============================================================================

    document.getElementById('prevMonth').addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      renderCalendar();
      updateStats();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      renderCalendar();
      updateStats();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      viewDate = new Date();
      renderCalendar();
      updateStats();
    });

    // ============================================================================
    // SERVICE WORKER REGISTRATION
    // ============================================================================

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered:', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // ============================================================================
    // INITIALIZATION
    // ============================================================================

    // Initial render
    renderCalendar();
    updateStats();
  </script>
</body>
</html>

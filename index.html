<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <meta name="description" content="Office attendance tracker PWA">
  <title>Office Tracker</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom styles for better mobile experience */
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .day-tile {
      aspect-ratio: 1;
      transition: all 0.2s ease;
      user-select: none;
    }
    .day-tile:active:not(.weekend):not(.future) {
      transform: scale(0.95);
    }
    .progress-bar-fill {
      transition: width 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-md mx-auto px-4 py-6">
    <!-- Header with compliance ratio -->
    <div class="bg-white rounded-lg shadow-sm p-6 mb-4">
      <h1 class="text-2xl font-bold text-gray-800 mb-2" id="monthName">Loading...</h1>
      <div class="text-3xl font-bold" id="complianceRatio">— / — nap — —%</div>
    </div>

    <!-- Navigation -->
    <div class="flex justify-between items-center mb-4">
      <button id="prevMonth" class="px-4 py-2 bg-white rounded-lg shadow-sm text-gray-700 font-medium hover:bg-gray-50">
        ← Előző
      </button>
      <button id="todayBtn" class="px-6 py-2 bg-blue-500 text-white rounded-lg shadow-sm font-medium hover:bg-blue-600">
        Ma
      </button>
      <button id="nextMonth" class="px-4 py-2 bg-white rounded-lg shadow-sm text-gray-700 font-medium hover:bg-gray-50">
        Következő →
      </button>
    </div>

    <!-- Calendar grid -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
      <!-- Weekday headers -->
      <div class="grid grid-cols-7 gap-2 mb-2">
        <div class="text-center text-xs font-semibold text-gray-600">H</div>
        <div class="text-center text-xs font-semibold text-gray-600">K</div>
        <div class="text-center text-xs font-semibold text-gray-600">Sze</div>
        <div class="text-center text-xs font-semibold text-gray-600">Cs</div>
        <div class="text-center text-xs font-semibold text-gray-600">P</div>
        <div class="text-center text-xs font-semibold text-gray-600">Szo</div>
        <div class="text-center text-xs font-semibold text-gray-600">V</div>
      </div>

      <!-- Calendar days -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-2">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Progress bar -->
    <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-medium text-gray-700">Iroda arány</span>
        <span class="text-sm font-bold" id="progressPercent">—%</span>
      </div>
      <div class="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
        <div id="progressBar" class="progress-bar-fill h-full bg-green-500 rounded-full" style="width: 0%"></div>
      </div>
      <div class="text-xs text-gray-500 mt-1 text-center">Cél: 50%</div>
    </div>

    <!-- Stats section -->
    <div class="bg-white rounded-lg shadow-sm p-4">
      <h2 class="text-lg font-bold text-gray-800 mb-3">Statisztika</h2>
      <div class="space-y-2">
        <div class="flex justify-between">
          <span class="text-gray-600">✅ Irodai napok:</span>
          <span class="font-semibold" id="officeDays">0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600">🏠 Home office napok:</span>
          <span class="font-semibold" id="homeDays">0</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600">🎉 Szabadságok:</span>
          <span class="font-semibold" id="holidayDays">0</span>
        </div>
        <div class="border-t pt-2 mt-2 flex justify-between">
          <span class="text-gray-800 font-medium">Összes munkanap:</span>
          <span class="font-bold" id="workingDays">0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================================
    // STATE & DATA
    // ============================================================================

    let currentDate = new Date();
    let viewDate = new Date(); // The month currently being viewed

    const STORAGE_KEY = 'attendance';
    const STATUS = {
      EMPTY: null,      // Home office (default, not stored)
      OFFICE: 'office', // Office day
      HOLIDAY: 'holiday' // Holiday/vacation
    };

    // ============================================================================
    // DATA PERSISTENCE
    // ============================================================================

    function loadAttendance() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : {};
    }

    function saveAttendance(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getDayStatus(dateStr) {
      const attendance = loadAttendance();
      const monthKey = dateStr.substring(0, 7); // "2025-05"
      return attendance[monthKey]?.[dateStr] || STATUS.EMPTY;
    }

    function setDayStatus(dateStr, status) {
      const attendance = loadAttendance();
      const monthKey = dateStr.substring(0, 7);

      if (!attendance[monthKey]) {
        attendance[monthKey] = {};
      }

      if (status === STATUS.EMPTY) {
        // Remove from storage (empty = home office)
        delete attendance[monthKey][dateStr];
        // Clean up empty month objects
        if (Object.keys(attendance[monthKey]).length === 0) {
          delete attendance[monthKey];
        }
      } else {
        attendance[monthKey][dateStr] = status;
      }

      saveAttendance(attendance);
    }

    // ============================================================================
    // DATE UTILITIES
    // ============================================================================

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isWeekend(date) {
      const day = date.getDay();
      return day === 0 || day === 6; // Sunday or Saturday
    }

    function isToday(date) {
      return formatDate(date) === formatDate(currentDate);
    }

    function isFuture(date) {
      return date > currentDate;
    }

    function isSameMonth(date1, date2) {
      return date1.getFullYear() === date2.getFullYear() &&
             date1.getMonth() === date2.getMonth();
    }

    function getMonthName(date) {
      const months = ['Január', 'Február', 'Március', 'Április', 'Május', 'Június',
                      'Július', 'Augusztus', 'Szeptember', 'Október', 'November', 'December'];
      return `${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    // ============================================================================
    // CALENDAR CALCULATIONS
    // ============================================================================

    function getMonthStats(date) {
      const year = date.getFullYear();
      const month = date.getMonth();

      // Get first and last day of month
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      let officeCount = 0;
      let holidayCount = 0;
      let weekdayCount = 0;

      // Iterate through all days in the month
      for (let day = 1; day <= lastDay.getDate(); day++) {
        const currentDay = new Date(year, month, day);

        if (!isWeekend(currentDay)) {
          weekdayCount++;

          const dateStr = formatDate(currentDay);
          const status = getDayStatus(dateStr);

          if (status === STATUS.OFFICE) {
            officeCount++;
          } else if (status === STATUS.HOLIDAY) {
            holidayCount++;
          }
        }
      }

      const workingDays = weekdayCount - holidayCount;
      const homeDays = workingDays - officeCount;
      const officePercent = workingDays > 0 ? Math.round((officeCount / workingDays) * 100) : 0;

      return {
        officeCount,
        homeDays,
        holidayCount,
        weekdayCount,
        workingDays,
        officePercent
      };
    }

    // ============================================================================
    // STATUS CYCLING
    // ============================================================================

    function cycleStatus(currentStatus) {
      if (currentStatus === STATUS.EMPTY) {
        return STATUS.OFFICE;
      } else if (currentStatus === STATUS.OFFICE) {
        return STATUS.HOLIDAY;
      } else {
        return STATUS.EMPTY;
      }
    }

    // ============================================================================
    // UI RENDERING
    // ============================================================================

    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      // Update month name
      document.getElementById('monthName').textContent = getMonthName(viewDate);

      // Get first day of month and its weekday (0 = Sunday, 1 = Monday, etc.)
      const firstDay = new Date(year, month, 1);
      let firstWeekday = firstDay.getDay();
      // Convert Sunday (0) to 7 for easier calculation (Monday = 1, Sunday = 7)
      firstWeekday = firstWeekday === 0 ? 7 : firstWeekday;

      // Get last day of month
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      // Add empty cells for days before month starts (Monday = 1, so firstWeekday - 1)
      for (let i = 1; i < firstWeekday; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-tile';
        grid.appendChild(emptyCell);
      }

      // Add day tiles
      for (let day = 1; day <= daysInMonth; day++) {
        const currentDay = new Date(year, month, day);
        const dateStr = formatDate(currentDay);
        const status = getDayStatus(dateStr);
        const weekend = isWeekend(currentDay);
        const today = isToday(currentDay);
        const future = isFuture(currentDay);

        const tile = document.createElement('div');
        tile.className = 'day-tile rounded-lg flex flex-col items-center justify-center text-sm font-medium cursor-pointer';

        // Base styles
        if (weekend) {
          tile.className += ' weekend bg-gray-100 text-gray-400 cursor-default';
        } else if (future) {
          tile.className += ' future bg-gray-50 text-gray-400 cursor-default';
        } else {
          // Apply status-based styling
          if (status === STATUS.OFFICE) {
            tile.className += ' bg-green-500 text-white';
          } else if (status === STATUS.HOLIDAY) {
            tile.className += ' bg-purple-500 text-white';
          } else {
            tile.className += ' bg-gray-200 text-gray-700';
          }
        }

        // Today's highlight
        if (today) {
          tile.className += ' ring-4 ring-blue-400 ring-offset-1';
        }

        // Day number
        const dayNum = document.createElement('div');
        dayNum.textContent = day;
        dayNum.className = 'text-lg';
        tile.appendChild(dayNum);

        // Status icon
        if (!weekend && !future && status !== STATUS.EMPTY) {
          const icon = document.createElement('div');
          icon.className = 'text-xs mt-1';
          icon.textContent = status === STATUS.OFFICE ? '✅' : '🎉';
          tile.appendChild(icon);
        }

        // Click handler (only for non-weekend, non-future days)
        if (!weekend && !future) {
          tile.addEventListener('click', () => {
            const newStatus = cycleStatus(status);
            setDayStatus(dateStr, newStatus);
            renderCalendar();
            updateStats();
          });
        }

        grid.appendChild(tile);
      }
    }

    function updateStats() {
      const stats = getMonthStats(viewDate);

      // Update compliance ratio
      const complianceText = `${stats.officeCount} / ${stats.workingDays} nap — ${stats.officePercent}% ${stats.officePercent >= 50 ? '✅' : '❌'}`;
      document.getElementById('complianceRatio').textContent = complianceText;
      document.getElementById('complianceRatio').className = `text-3xl font-bold ${stats.officePercent >= 50 ? 'text-green-600' : 'text-red-600'}`;

      // Update stats
      document.getElementById('officeDays').textContent = stats.officeCount;
      document.getElementById('homeDays').textContent = stats.homeDays;
      document.getElementById('holidayDays').textContent = stats.holidayCount;
      document.getElementById('workingDays').textContent = stats.workingDays;

      // Update progress bar
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      progressBar.style.width = `${Math.min(stats.officePercent, 100)}%`;
      progressBar.className = `progress-bar-fill h-full rounded-full ${stats.officePercent >= 50 ? 'bg-green-500' : 'bg-red-500'}`;
      progressPercent.textContent = `${stats.officePercent}%`;
      progressPercent.className = `text-sm font-bold ${stats.officePercent >= 50 ? 'text-green-600' : 'text-red-600'}`;
    }

    // ============================================================================
    // NAVIGATION
    // ============================================================================

    document.getElementById('prevMonth').addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      renderCalendar();
      updateStats();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      renderCalendar();
      updateStats();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      viewDate = new Date();
      renderCalendar();
      updateStats();
    });

    // ============================================================================
    // SERVICE WORKER REGISTRATION
    // ============================================================================

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered:', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

    // ============================================================================
    // INITIALIZATION
    // ============================================================================

    // Initial render
    renderCalendar();
    updateStats();
  </script>
</body>
</html>
